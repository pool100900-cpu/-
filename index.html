<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الأفعى</title>
    <style>
        body {
            background-color: #1e1e2e;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        canvas {
            border: 3px solid #89b4fa;
            background-color: #11111b;
            box-shadow: 0 0 15px rgba(137, 180, 250, 0.3);
        }
        .controls {
            margin-top: 15px;
            display: grid;
            grid-template-columns: repeat(3, 60px);
            gap: 10px;
        }
        button {
            width: 60px;
            height: 60px;
            font-size: 20px;
            background-color: #313244;
            color: white;
            border: 1px solid #89b4fa;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <h2>لعبة الأفعى</h2>
    <canvas id="gameCanvas" width="300" height="300"></canvas>

    <!-- أزرار التحكم للهواتف -->
    <div class="controls">
        <div></div>
        <button onclick="changeDir('UP')">⬆️</button>
        <div></div>
        <button onclick="changeDir('LEFT')">⬅️</button>
        <button onclick="changeDir('DOWN')">⬇️</button>
        <button onclick="changeDir('RIGHT')">➡️</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const box = 15;
        let snake = [{ x: 10 * box, y: 10 * box }];
        let food = {
            x: Math.floor(Math.random() * 19 + 1) * box,
            y: Math.floor(Math.random() * 19 + 1) * box
        };
        let dir = "RIGHT";

        document.addEventListener("keydown", direction);

        function changeDir(newDir) {
            if (newDir === "LEFT" && dir !== "RIGHT") dir = "LEFT";
            if (newDir === "UP" && dir !== "DOWN") dir = "UP";
            if (newDir === "RIGHT" && dir !== "LEFT") dir = "RIGHT";
            if (newDir === "DOWN" && dir !== "UP") dir = "DOWN";
        }

        function direction(event) {
            if (event.keyCode === 37 && dir !== "RIGHT") dir = "LEFT";
            else if (event.keyCode === 38 && dir !== "DOWN") dir = "UP";
            else if (event.keyCode === 39 && dir !== "LEFT") dir = "RIGHT";
            else if (event.keyCode === 40 && dir !== "UP") dir = "DOWN";
        }

        function draw() {
            ctx.fillStyle = "#11111b";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < snake.length; i++) {
                ctx.fillStyle = i === 0 ? "#a6e3a1" : "#94e2d5";
                ctx.fillRect(snake[i].x, snake[i].y, box, box);
            }

            ctx.fillStyle = "#f38ba8";
            ctx.fillRect(food.x, food.y, box, box);

            let snakeX = snake[0].x;
            let snakeY = snake[0].y;

            if (dir === "LEFT") snakeX -= box;
            if (dir === "UP") snakeY -= box;
            if (dir === "RIGHT") snakeX += box;
            if (dir === "DOWN") snakeY += box;

            if (snakeX === food.x && snakeY === food.y) {
                food = {
                    x: Math.floor(Math.random() * 19 + 1) * box,
                    y: Math.floor(Math.random() * 19 + 1) * box
                };
            } else {
                snake.pop();
            }

            let newHead = { x: snakeX, y: snakeY };

            if (
                snakeX < 0 || snakeX >= canvas.width ||
                snakeY < 0 || snakeY >= canvas.height ||
                collision(newHead, snake)
            ) {
                clearInterval(game);
                alert("انتهت اللعبة!");
                location.reload();
            }

            snake.unshift(newHead);
        }

        function collision(head, array) {
            for (let i = 0; i < array.length; i++) {
                if (head.x === array[i].x && head.y === array[i].y) return true;
            }
            return false;
        }

        // تم إبطاء السرعة إلى 280 ملي ثانية لتجربة أسهل
        let game = setInterval(draw, 280);
    </script>
</body>
</html>
